services:
  # ------------------------------------------------------------------
  # 1. QueueCTL Web Monitoring Dashboard
  # ------------------------------------------------------------------
  - type: web
    name: queuectl-dashboard
    env: python
    buildCommand: "pip install -e ."
    startCommand: "queuectl init --db-path /tmp/queuectl.db && queuectl dashboard --host 0.0.0.0 --db-path /tmp/queuectl.db"
    plan: free
    envVars:
      - key: QUEUECTL_DB_PATH
        value: /tmp/queuectl.db
      - key: PYTHONUNBUFFERED
        value: "1"
