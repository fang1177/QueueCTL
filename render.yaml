services:
  # ------------------------------------------------------------------
  # 1. QueueCTL Web Monitoring Dashboard
  # ------------------------------------------------------------------
  - type: web
    name: queuectl-dashboard
    env: python
    buildCommand: "pip install -e ."
    startCommand: "queuectl init && queuectl dashboard --host 0.0.0.0"
    plan: free
    disk:
      name: queuectl-db-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: QUEUECTL_DB_PATH
        value: /var/data/queuectl.db
      - key: PYTHONUNBUFFERED
        value: "1"

  # ------------------------------------------------------------------
  # 2. QueueCTL Background Worker Process
  # ------------------------------------------------------------------
  - type: worker
    name: queuectl-worker
    env: python
    buildCommand: "pip install -e ."
    startCommand: "queuectl worker start"
    plan: free
    disk:
      name: queuectl-db-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: QUEUECTL_DB_PATH
        value: /var/data/queuectl.db
      - key: PYTHONUNBUFFERED
        value: "1"
